                <div class="card hidden"><img src="/Portfolio Images/New month, fresh design!Kicked off April with this bold and faith-filled flyer for @mfmcf_unibe.webp" alt="Web project 5"></div>

    <footer>

    </footer>
        <style>
        h2 {
            margin-bottom: 15px;
        }

            .portfolio-hint {
                margin: 6px 0 14px;
                color: var(--muted, #666);
                font-size: 0.95rem;
            }

        /* Portfolio grid */
        .portfolio {
            margin-bottom: 50px;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: relative; /* needed for overlay */
        }

        .card:hover {
            transform: scale(1.03);
        }

        /* Per-card overlay badge */
        .card::after {
            content: "Click to expand";
            position: absolute;
            right: 10px;
            bottom: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 0.8rem;
            padding: 6px 10px;
            border-radius: 999px;
            opacity: 0.95;
            pointer-events: none;
            transition: transform 0.18s ease, opacity 0.18s ease;
        }

        .card:hover::after {
            transform: translateY(-4px) scale(1.03);
            opacity: 1;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        /* Show More button */
        .show-more {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            background: #007bff;
            color: white;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
        }

        .show-more:hover {
            background: #0056b3;
        }

        .hidden {
            display: none;
        }

        /* Fullscreen viewer */
        #image-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        /* ensure .hidden actually hides the #image-viewer (higher specificity) */
        #image-viewer.hidden {
            display: none;
        }

        #image-viewer img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        #close-viewer {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: white;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card img {
                height: 140px;
            }
        }
    </style>
    <script src="script.js"></script>
</body>

</html>
